<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/authstyle.css">
    <script type="module" src="../scripts/login.js"></script>
</head>
<body>
    <div id="content">
        <h1>USER LOGIN</h1>
        <div id="loginBox">
            <form action="#" method="post" id="login-form">
                <input name="email" id="email" type="text" placeholder="Email">
                <input name="password" id="password" type="password" placeholder="Senha">
                <div class="options-container">
                    <div>
                        <input name="rememberMe" id="rememberMe" type="checkbox">
                        <label for="rememberMe">Lembrar da minha senha</label>
                    </div>
                    <a id="esqueci" href="#">Esquci a senha</a>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <button id="btn-ir-registro">REGISTER</button>
        <br>
        <button id="btn-ir-logout">LOGOUT</button>
        <br>
        <button id="btn-ir-home">HOME</button>
        
    </div>
</body>
</html>
