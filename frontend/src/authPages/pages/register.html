<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="..//styles/authstyle.css">
    <script type="module" src="../scripts/register.js"></script>
</head>
<body>
    <div id="content">
        <h1>USER REGISTER</h1>
        <div id="loginBox">
            <form action="#" method="post" id="form-register">
                <input name="name" type="text" id="name" placeholder="Nome">
                <input name="email" id="email" type="text" placeholder="Email">
                <input name="password" id="password" type="password" placeholder="Senha">
                <input name="localization" id="localization" type="text" placeholder="Cidade"><!--precisa ser um input de localizaçao com mapa, tem que usar js para isso e uma api tercerizada-->
                <button type="submit">REGISTER</button>
            </form>
        </div>
        <button id="btn-ir-login">LOGIN</button>
        <br>
        <button id="btn-ir-home">HOME</button>
    </div>
</body>
</html>
